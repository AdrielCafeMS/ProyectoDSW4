spring.application.name=backend

# CONFIGURACI\u00d3N DE CONEXI\u00d3N A MARIADB
spring.datasource.url=jdbc:mariadb://localhost:3306/dsw4?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# CONFIGURACI\u00d3N DE JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ESTRATEGIA F\u00cdSICA DE NOMBRAMIENTO (Mapeo a MariaDB)
# Convierte CamelCase de Java a snake_case en la base de datos de HeidiSQL
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
